<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <title>返回 · 科学可视化</title>
  <script>
    try {
      var t = localStorage.getItem('science-viz-theme');
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f7f7f4; --text: #131311; --muted: #66655e; --dim: #6f6e66;
      --border: #deddd6; --accent: #3f52cf;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0d0d0c; --text: #f4f4ef; --muted: #a3a29a; --dim: #8b8a81;
      --border: #2d2d29; --accent: #9aa7ff; color-scheme: dark;
    }
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    main { width: min(34rem, 100%); border-top: 1px solid var(--border); padding-top: 1.5rem; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 1.25rem; }
    h1 { font-size: 2rem; letter-spacing: -0.04em; margin: 0 0 0.75rem; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 0.9rem; }
    a:hover { border-color: var(--text); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
  <script>
    // GitHub Pages: keep the repo base when redirecting a 404 path.
    var seg = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
    var base = '/';
    if (seg.length && !seg[0].includes('.')) {
      if (location.hostname.endsWith('github.io') && seg[0] !== 'index.html') {
        base = '/' + seg[0] + '/';
      }
    }
    var hash = location.hash || '#/';
    setTimeout(function () { location.replace(base + 'index.html' + hash); }, 30);
  </script>
</head>
<body>
  <main>
    <h1>页面不存在</h1>
    <p>正在返回科学可视化。</p>
    <a href="./index.html#/">返回首页</a>
  </main>
</body>
</html>
